<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ICD-10 外因索引查询"><title>ICD-10 外因索引查询</title><style>
:root{color-scheme:light dark;--bg:#f5f7fa;--panel:#fff;--text:#1f2937;--muted:#667085;--border:#d8dee8;--accent:#2563eb;--chip:#eef4ff;--chipText:#1849a9;--subtle:#f8fafc;--shadow:0 8px 28px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--text:#f2f4f7;--muted:#98a2b3;--border:#303541;--accent:#78a9ff;--chip:#1f2d49;--chipText:#b9d1ff;--subtle:#11151c;--shadow:none}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:44px 0 72px}header{text-align:center;margin-bottom:24px}h1{margin:0 0 8px;font-size:clamp(27px,5vw,40px)}.subtitle,.meta,.en,.page,.crumbs{color:var(--muted)}.subtitle{font-size:14px;line-height:1.6}.search-shell{position:sticky;top:12px;z-index:5;padding:10px;border:1px solid var(--border);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);box-shadow:var(--shadow)}.search-row{display:flex;gap:8px}.search-input{width:100%;border:0;outline:0;padding:15px 16px;background:transparent;color:var(--text);font-size:17px}.clear{display:none;border:0;border-radius:10px;padding:10px 13px;background:var(--chip);color:var(--chipText);cursor:pointer}.meta{min-height:24px;padding:14px 4px 8px;font-size:14px}.results{display:grid;gap:14px}.card{border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--panel);box-shadow:var(--shadow)}.crumbs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;font-size:13px}.crumb,.child{cursor:pointer}.crumb{border:0;padding:0;background:transparent;color:var(--accent)}.title-row{display:flex;justify-content:space-between;gap:12px}.zh{font-size:18px;font-weight:700;line-height:1.45}.page{font-size:12px;white-space:nowrap}.en{margin:3px 0 12px;overflow-wrap:anywhere}.code{display:inline-flex;padding:8px 11px;border-radius:10px;background:var(--chip);color:var(--chipText);font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}.level{margin-left:8px;font-size:12px;color:var(--muted)}.children{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}.children-title{margin-bottom:8px;color:var(--muted);font-size:13px}.child-list{display:grid;gap:7px}.child{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;padding:9px 10px;border-radius:10px;background:var(--subtle);color:var(--text);text-align:left}.child-zh{font-weight:600}.child-en{display:block;color:var(--muted);font-size:12px}.child-code{color:var(--chipText);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;white-space:nowrap}mark{border-radius:3px;padding:0 .08em;background:#ffe58f;color:#111827}.empty{padding:48px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;background:var(--panel)}@media(max-width:600px){.wrap{padding-top:26px}.title-row{align-items:flex-start}}
</style></head><body><main class="wrap"><header><h1>ICD-10 外因索引</h1><div class="subtitle">支持中文、英文及 V / W / X / Y 编码检索；多关键词为 AND；显示完整父级路径和直接子项</div></header><section class="search-shell"><div class="search-row"><input id="q" class="search-input" type="search" autocomplete="off" autofocus placeholder="例如：跌倒 / fall / W01"><button id="clear" class="clear" type="button">清空</button></div></section><div id="meta" class="meta">正在载入数据……</div><section id="results" class="results"></section></main><script>const DATA=__EINDEX_DATA__;(()=>{"use strict";const MAX=200,q=document.getElementById('q'),clear=document.getElementById('clear'),meta=document.getElementById('meta'),results=document.getElementById('results');const norm=v=>String(v??'').toLowerCase().replace(/[，、；;]+/g,' ').replace(/\s+/g,' ').trim();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const rx=v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');function hi(v,terms){let out=esc(v);for(const t of terms)if(t)out=out.replace(new RegExp(`(${rx(t)})`,'ig'),'<mark>$1</mark>');return out}DATA.forEach((r,i)=>{r._position=i;r._search=norm([r.name_zh,r.name_en,r.code].join(' '));if(!Array.isArray(r.children))r.children=[]});function ancestors(pos){const a=[],seen=new Set;let p=DATA[pos]?.parent;while(Number.isInteger(p)&&p>=0&&p<DATA.length&&!seen.has(p)){seen.add(p);a.unshift(p);p=DATA[p]?.parent}return a}function breadcrumb(pos){const a=ancestors(pos);if(!a.length)return'';return `<div class="crumbs">${a.map((p,i)=>`<button class="crumb" data-pos="${p}">${esc(DATA[p].name_zh||DATA[p].name_en)}</button>${i<a.length-1?' › ':''}`).join('')}</div>`}function children(r){if(!r.children.length)return'';return `<div class="children"><div class="children-title">直接子项（${r.children.length}）</div><div class="child-list">${r.children.map(p=>{const c=DATA[p];return `<button class="child" data-pos="${p}"><span><span class="child-zh">${esc(c.name_zh||'（无中文名）')}</span><span class="child-en">${esc(c.name_en)}</span></span><span class="child-code">${esc(c.code)}</span></button>`}).join('')}</div></div>`}function card(pos,terms){const r=DATA[pos];return `<article class="card">${breadcrumb(pos)}<div class="title-row"><div class="zh">${hi(r.name_zh||'（无中文名）',terms)}</div><div class="page">${r.page?`第 ${r.page} 页`:''}</div></div><div class="en">${hi(r.name_en,terms)}</div><div><span class="code">${r.code?hi(r.code,terms):'—'}</span><span class="level">层级 ${r.level}</span></div>${children(r)}</article>`}function render(){const raw=q.value.trim(),terms=norm(raw).split(' ').filter(Boolean);clear.style.display=raw?'block':'none';if(!terms.length){meta.textContent=`共 ${DATA.length} 条索引，输入关键词开始查询`;results.innerHTML='';return}let total=0,visible=[];for(let i=0;i<DATA.length;i++)if(terms.every(t=>DATA[i]._search.includes(t))){total++;if(visible.length<MAX)visible.push(i)}meta.textContent=total?`命中 ${total} 条${total>MAX?`，显示前 ${MAX} 条`:''}`:'未找到匹配词条';results.innerHTML=visible.length?visible.map(p=>card(p,terms)).join(''):'<div class="empty">未找到匹配词条。可尝试缩短关键词或仅输入编码前三位。</div>'}results.addEventListener('click',e=>{const b=e.target.closest('[data-pos]');if(!b)return;const r=DATA[Number(b.dataset.pos)];q.value=r.name_zh||r.name_en||r.code;render();scrollTo({top:0,behavior:'smooth'})});q.addEventListener('input',render);clear.addEventListener('click',()=>{q.value='';render();q.focus()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}if(e.key==='Escape'&&document.activeElement===q){q.value='';render()}});render()})();</script></body></html>
