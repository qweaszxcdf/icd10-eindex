<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="ICD-10 外因索引查询">
    <title>ICD-10 外因索引查询</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f7fa;
            --panel: #fff;
            --text: #1f2937;
            --muted: #667085;
            --border: #d8dee8;
            --accent: #2563eb;
            --chip: #eef4ff;
            --chipText: #1849a9;
            --subtle: #f8fafc;
            --shadow: 0 8px 28px rgba(16, 24, 40, .08)
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #0f1115;
                --panel: #171a21;
                --text: #f2f4f7;
                --muted: #98a2b3;
                --border: #303541;
                --accent: #78a9ff;
                --chip: #1f2d49;
                --chipText: #b9d1ff;
                --subtle: #11151c;
                --shadow: none
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        .wrap {
            width: min(980px, calc(100% - 28px));
            margin: auto;
            padding: 44px 0 72px
        }

        header {
            text-align: center;
            margin-bottom: 24px
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(27px, 5vw, 40px)
        }

        .subtitle,
        .meta,
        .en,
        .page,
        .crumbs {
            color: var(--muted)
        }

        .subtitle {
            font-size: 14px;
            line-height: 1.6
        }

        .reference {
            display: inline-block;
            margin-top: 8px;
            color: var(--accent);
            font-size: 13px
        }

        .search-shell {
            position: sticky;
            top: 12px;
            z-index: 5;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow)
        }

        .search-row {
            display: flex;
            gap: 8px
        }

        .search-input {
            width: 100%;
            border: 0;
            outline: 0;
            padding: 15px 16px;
            background: transparent;
            color: var(--text);
            font-size: 17px
        }

        .clear {
            display: none;
            border: 0;
            border-radius: 10px;
            padding: 10px 13px;
            background: var(--chip);
            color: var(--chipText);
            cursor: pointer
        }

        .meta {
            min-height: 24px;
            padding: 14px 4px 8px;
            font-size: 14px
        }

        .results {
            display: grid;
            gap: 14px
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            background: var(--panel);
            box-shadow: var(--shadow)
        }

        .crumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
            font-size: 13px
        }

        .crumb,
        .child,
        .see {
            cursor: pointer
        }

        .crumb,
        .see {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--accent)
        }

        .see {
            text-decoration: underline
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            gap: 12px
        }

        .title-row .zh {
            flex: 1
        }

        .zh {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.45
        }

        .page {
            font-size: 12px;
            white-space: nowrap
        }

        .en {
            margin: 3px 0 12px;
            overflow-wrap: anywhere
        }

        .code {
            display: inline-flex;
            padding: 8px 11px;
            border-radius: 10px;
            background: var(--chip);
            color: var(--chipText);
            font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace;
            text-decoration: none
        }

        .code:hover,
        .child-code:hover {
            text-decoration: underline
        }

        .code:focus-visible,
        .child-code:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .level {
            margin-left: 8px;
            font-size: 12px;
            color: var(--muted)
        }

        .children {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border)
        }

        .children-title {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px
        }

        .child-list {
            display: grid;
            gap: 7px
        }

        .child {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            border-radius: 10px;
            background: var(--subtle);
            color: var(--text);
            overflow: hidden
        }

        .child-main {
            min-width: 0;
            flex: 1 1 auto;
            border: 0;
            padding: 9px 10px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer
        }

        .child-zh {
            font-weight: 600
        }

        .child-en {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        .child-code {
            display: flex;
            align-items: center;
            padding: 9px 10px;
            color: var(--chipText);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 700;
            white-space: nowrap;
            text-decoration: none
        }

        .card-feedback {
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 11px;
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px
        }

        .card-feedback:hover {
            background: var(--chip)
        }

        mark {
            border-radius: 3px;
            padding: 0 .08em;
            background: #ffe58f;
            color: #111827
        }

        .empty {
            padding: 48px 18px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 16px;
            background: var(--panel)
        }

        .feedback-dialog {
            width: min(600px, calc(100% - 24px));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 0;
            background: var(--panel);
            color: var(--text);
            box-shadow: var(--shadow)
        }

        .feedback-dialog::backdrop {
            background: rgb(0 0 0 / .5);
            backdrop-filter: blur(3px)
        }

        .feedback-dialog form {
            padding: 22px
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px
        }

        .feedback-record-name {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 15px
        }

        .field span {
            font-size: 14px;
            font-weight: 600
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px;
            background: var(--subtle);
            color: var(--text)
        }

        .field textarea {
            resize: vertical
        }

        .feedback-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px
        }

        .primary-btn,
        .secondary-btn {
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer
        }

        .primary-btn {
            border: 0;
            background: var(--accent);
            color: white
        }

        .secondary-btn {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text)
        }

        .feedback-status {
            min-height: 22px;
            color: var(--muted);
            font-size: 14px
        }

        @media(max-width:600px) {
            .wrap {
                padding-top: 26px
            }

            .title-row {
                flex-wrap: wrap
            }

            .page {
                margin-left: auto
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <header>
            <h1>ICD-10 外因索引</h1>
            <div class="subtitle">支持中文、英文及 V / W / X / Y 编码检索；多关键词为 AND；显示完整父级路径和直接子项</div><a class="reference"

        </form>
    </dialog>

          confidence: row.confidence
        },
        url: location.href
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "提交失败");
    submitted = true;
    status.textContent = "反馈已提交";
    feedbackCloseTimer = setTimeout(() => {
      feedbackCloseTimer = null;
      document.getElementById("feedback-dialog").close()
    }, 800)
  } catch (error) {
    status.textContent = error.message
  } finally {
    if (!submitted) button.disabled = false
  }
}); render() })();</script>
